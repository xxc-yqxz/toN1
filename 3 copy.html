<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>言葉 - 极简背诵</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --accent-color: #f0f0f0;
        --border-color: #000000;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Hiragino Mincho ProN', 'MS Mincho', serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        line-height: 1.6;
      }

      /* 顶部导航 */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        box-sizing: border-box;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-color);
        z-index: 10;
      }

      .logo {
        font-weight: bold;
        letter-spacing: 2px;
      }
      .settings-btn {
        cursor: pointer;
        text-decoration: underline;
        font-size: 0.9em;
      }

      /* 主体内容 */
      main {
        text-align: center;
        max-width: 600px;
        width: 90%;
        margin-top: 80px;
      }
      #word-display {
        font-size: 3rem;
        margin-bottom: 20px;
        font-weight: 500;
        min-height: 80px;
      }

      /* 收藏纠错动作按钮 */
      .action-btns {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .action-btns span {
        cursor: pointer;
        font-size: 1.5rem;
        opacity: 0.3;
        transition: all 0.3s;
      }
      .action-btns span.active {
        opacity: 0.8;
      }

      /* 播放按钮 */
      .word-display-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .speak-btn-small {
        background: transparent;
        border: 1px solid var(--border-color);
        padding: 4px 8px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.8rem;
        border-radius: 3px;
      }
      .speak-btn-small:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }
      .content-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }
      .content-line:last-child {
        margin-bottom: 0;
      }
      .speak-buttons {
        display: flex;
        gap: 4px;
      }
      .action-btns span:hover {
        opacity: 0.8;
      }

      #content-display {
        font-size: 1.1rem;
        text-align: left;
        margin-bottom: 40px;
        padding: 20px;
        border-left: 2px solid var(--border-color);
        min-height: 100px;
        display: none;
      }

      button {
        background: transparent;
        border: 1px solid var(--border-color);
        padding: 10px 20px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        margin: 5px;
      }
      button:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }
      .show-btn {
        font-size: 1.2rem;
        width: 200px;
        margin-bottom: 20px;
      }

      /* 弹窗样式 */
      #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.98);
        z-index: 100;
        overflow-y: auto;
      }
      .modal-content {
        max-width: 650px;
        margin: 50px auto;
        padding: 20px;
      }
      .modal-header {
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
      }

      .config-section {
        background: #f9f9f9;
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid #eee;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #000;
        margin-bottom: 10px;
        box-sizing: border-box;
        font-family: inherit;
      }

      .lib-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #eee;
        margin-bottom: 5px;
        font-size: 0.8rem;
      }

      .word-list {
        list-style: none;
        padding: 0;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #000;
        margin-top: 10px;
      }
      .word-list li {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
      }
      .word-list li:hover {
        background: #000;
        color: #fff;
      }

      .close-modal {
        cursor: pointer;
        font-weight: bold;
      }
      .progress {
        font-size: 0.8rem;
        margin-top: 10px;
        opacity: 0.6;
      }
      hr {
        border: 0;
        border-top: 1px solid #000;
        margin: 25px 0;
      }
      h4 {
        margin: 15px 0 5px 0;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">KOTOBA.</div>
      <div class="settings-btn" onclick="toggleModal(true)">SETTINGS & NOTEBOOK</div>
    </header>

    <main>
      <div class="word-display-container">
        <div id="word-display">未加载数据</div>
        <button class="speak-btn-small" onclick="speakWord()" title="播放单词">🔊</button>
      </div>

      <div class="action-btns" id="current-actions">
        <span id="star-btn" onclick="toggleRecord('fav')">⭐ 收藏</span>
        <span id="err-btn" onclick="toggleRecord('err')">❌ 纠错</span>
      </div>

      <div id="content-display"></div>
      <button class="show-btn" id="toggle-btn" onclick="showAnswer()">显示答案</button>
      <div class="btn-group">
        <button onclick="prevWord()">← PREV</button>
        <button onclick="nextWord()">NEXT →</button>
      </div>
      <div class="progress" id="progress-text">0 / 0</div>
    </main>

    <div id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>DASHBOARD</span>
          <span class="close-modal" onclick="toggleModal(false)">[CLOSE]</span>
        </div>

        <div class="config-section">
          <h4>词库管理</h4>
          <div id="library-container" style="margin-top: 10px"></div>
        </div>

        <hr />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
          <div>
            <h4>⭐ 收藏本</h4>
            <ul class="word-list" id="fav-list"></ul>
          </div>
          <div>
            <h4>❌ 纠错本</h4>
            <ul class="word-list" id="err-list"></ul>
          </div>
        </div>

        <hr />

        <h4>快速跳转 / 搜索</h4>
        <div style="display: flex; gap: 10px">
          <input
            type="text"
            id="search-input"
            placeholder="输入w过滤当前词库..."
            oninput="handleSearch()"
            style="flex: 2"
          />
          <input
            type="number"
            id="jump-input"
            placeholder="No."
            onkeypress="if (event.keyCode == 13) jumpToIndex()"
            style="flex: 1"
          />
        </div>
        <ul class="word-list" id="full-word-list"></ul>
      </div>
    </div>

    <script>
      // 静态数据源数组
      const dataSource = [
        {
          name: 'N2语法',
          words: [
            {
              w: '～あげく',
              c: '各种…之后，最终得到了遗憾/不好的结果\n例：さんざん悩（なや）んだあげく、私（わたし）は彼（かれ）と別（わか）れることにした。\n译：苦恼了很久之后，我决定和他分手。'
            },
            {
              w: '～末に',
              c: '长时间…的结果\n例：家族（かぞく）ともよく話（はな）し合（あ）った末（すえ）、今年度（こんねんど）限（かぎ）りで引退（いんたい）することに決（き）めました。\n译：和家人多次商量之后，我决定在今年结束时辞职。'
            },
            {
              w: '～あまり',
              c: '因为过于…而…\n例：今（いま）のオリンピックは勝（か）ち負（ま）けを気（き）にするあまり、スポーツマンシップという大切（たいせつ）なものをなくしているのではないか。\n译：现在的奥运会过于在意输赢，反而失去了体育精神这一重要的东西吧。'
            },
            {
              w: 'あまりのNに',
              c: '因为过于…而…\n例：今年（ことし）の夏（なつ）はあまりの暑（あつ）さに食欲（しょくよく）もなくなってしまった。\n译：今年夏天太热了，以至于连食欲都没了。'
            },
            {
              w: '～最中だ',
              c: '正在…的时候\n例：授業（じゅぎょう）の最中（さいちゅう）に、突然（とつぜん）地震（じしん）が起（お）きた。\n译：上课途中突然发生了地震。'
            },
            {
              w: '～わりに',
              c: '与从…基准出发所想到的不一样\n例：この部屋（へや）は広（ひろ）いわりに、家賃（やちん）が安（やす）い。\n译：这个房间虽然很宽敞，但房租却很便宜。'
            },
            {
              w: '～のみならず',
              c: '不仅仅…\n例：森（もり）さんは出張先（しゅっちょうさき）でトラブルを起（お）こしたのみならず、部長（ぶちょう）への報告（ほうこく）も怠（おこた）った。\n译：森先生不仅在出差地惹了麻烦，还没有及时向部长报告。'
            },
            {
              w: '～おそれがある',
              c: '有…的担心/危险\n例：このまま赤字（あかじ）が続（つづ）けば、この会社（かいしゃ）は倒産（とうさん）するおそれがある。\n译：如果继续亏损下去，这家公司就有倒闭的危险。'
            },
            {
              w: '～次第',
              c: '…之后，立刻…\n例：スケジュールが決（き）まり次第（しだい）、すぐ知（し）らせてください。\n译：一旦确定了日程，请立刻通知我。'
            },
            {
              w: 'N次第（だ）',
              c: '依据…而定\n例：人生（じんせい）が楽（たの）しいかどうかは考（かんが）え方（かた）次第（しだい）だ。\n译：人生是否快乐取决于你的想法。'
            },
            {
              w: '～一方だ',
              c: '朝一个方向不断发展（多消极）\n例：静（しず）かな町（まち）だったのに、テレビで紹介（しょうかい）されて以来（いらい）、観光客（かんこうきゃく）が増（ふ）える一方（いっぽう）だ。\n译：这里原本是个安静的小镇，但自从被电视介绍后，游客越来越多。'
            },
            {
              w: '～一方（で）',
              c: '一方面…而另一方面…\n例：いい親（おや）は厳（きび）しくしかる一方（いっぽう）で、ほめることも忘（わす）れない。\n译：好家长会严格责备孩子，但另一方面，也不会忘记表扬孩子。'
            },
            {
              w: '～ばかりだ',
              c: '朝一个方向不断发展（消极）\n例：このままでは王（おう）さんの日本語（にほんご）の成績（せいせき）は下（さ）がるばかりだ。なんとかしなくてはならない。\n译：照这样下去，王同学的日语成绩只会越来越差，得想办法才行。'
            },
            {
              w: '～ばかりか',
              c: '不仅如此，而且……\n例：いくら薬（くすり）を飲（の）んでも、風邪（かぜ）が治（なお）らないばかりか、もっと悪（わる）くなってきました。\n译：喝了很多药，不仅感冒没好，反而更严重了。'
            },
            {
              w: '～ばかりに',
              c: '只因为…就导致了不好的结果\n例：うっかり生水（なまみず）を飲（の）んだばかりに、おなかを悪（わる）くしてしまった。\n译：正因为一时大意喝了生水，结果闹肚子了。'
            },
            {
              w: '～上で①',
              c: '对…来说，…很重要（目的）\n例：今度（こんど）の企画（きかく）を成功（せいこう）させる上（うえ）で、ぜひみんなの協力（きょうりょく）が必要（ひつよう）なのだ。\n译：为了让这次企划能够成功，需要大家的协助。'
            },
            {
              w: '～上で②',
              c: '先做…之后，再…（事后）\n例：詳（くわ）しいことはお目（め）にかかった上（うえ）で、説明（せつめい）いたします。\n译：详细的情况我会在见面后进行说明。'
            },
            {
              w: 'Nの上で',
              c: '根据…来看\n例：この機械（きかい）は見（み）かけの上（うえ）では使（つか）い方（かた）が難（むずか）しそうですが、実際（じっさい）はとても簡単（かんたん）なのです。\n译：这台机器外表看起来好像很难操作，其实非常简单。'
            },
            {
              w: '～上（に）',
              c: '不仅…而且（情况更糟或者更好）\n例：先週（せんしゅう）は熱（ねつ）が40度（ど）も出（で）た上（うえ）に、下痢（げり）が止（と）まらず、本当（ほんとう）に大変（たいへん）でした。\n译：上周不仅高烧到40度，还一直腹泻，真是太惨了。'
            },
            {
              w: '～上は',
              c: '既然…就（理所当然要）\n例：社長（しゃちょう）が決断（けつだん）した上（うえ）は、われわれ社員（しゃいん）はやることしかない。\n译：既然社长已经下了决断，我们员工就只能干了。'
            },
            {
              w: '～以上は',
              c: '既然…就（理所当然要）\n例：約束（やくそく）した以上（いじょう）、守（まも）るべきだと思（おも）う。\n译：既然约定了，就应该遵守。'
            },
            {
              w: '～からには',
              c: '既然…就（理所当然要）\n例：約束（やくそく）したからには、守（まも）るべきだと思（おも）う。\n译：既然约定了，就应该遵守。'
            },
            {
              w: 'Nのもと（で/に）',
              c: '在…影响之下、在…状态之下\n例：子育（こそだ）ては夫婦（ふうふ）協力（きょうりょく）のもとに行（おこな）われるべきだ。\n译：育儿应当夫妻协力进行。'
            },
            {
              w: 'Vるつもり①',
              c: '自己认为…（不管周围人的评价/看法）\n例：説明書（せつめいしょ）通（どお）りにやっているつもりなのに、どうしてもうまくできない。\n译：明明是按照说明书去做的，可不知为何就是做不好。'
            },
            {
              w: 'Vたつもり②',
              c: '就当是…\n例：旅行（りょこう）に行（い）ったつもりで、お金（かね）は貯金（ちょきん）することにした。\n译：把钱存起来，就当去旅行了。'
            },
            {
              w: '～つつ①',
              c: '一边…，一边…（同時進行）\n例：将来（しょうらい）の仕事（しごと）のこと、お金（かね）のことなどを考（かんが）えつつ、進路（しんろ）を選（えら）ばなければならない。\n译：必须要一边考虑将来的工作和金钱上的问题，一边思考今后的道路。'
            },
            {
              w: '～つつ（も）②',
              c: '虽然…（多为心理活动）但依然（做了不好的事情）（逆接）\n例：早（はや）く寝（ね）ようと思（おも）いつつ、ゲームがやめられなくて、夜（よ）が明（あ）けてしまった。\n译：想着要早点睡，可就是停不下游戏，结果玩到天都亮了。'
            },
            {
              w: '～ながら（も）',
              c: '虽然…但是…（逆接）\n例：綾（あや）は本当（ほんとう）のことを知（し）りながら、知（し）らないふりをしている。\n译：绫明明知道真相，却假装不知道。'
            },
            {
              w: '～つつある',
              c: '逐渐…\n例：夕日（ゆうひ）は山（やま）の向（む）こうに沈（しず）みつつある。\n译：夕阳正从山的那边缓缓落下。'
            },
            {
              w: '～どころか①',
              c: '岂止是…，是程度更高的…（程度の对比）\n例：この製品（せいひん）はアジア諸国（しょこく）どころかアフリカにまで輸出（ゆしゅつ）されている。\n译：这款产品不仅出口到亚洲各国，甚至也出口到非洲。'
            },
            {
              w: '～どころか②',
              c: '不是…而是相反的…（正反对）\n例：咳（せき）が出（で）るので、風邪（かぜ）かなと思（おも）っていたが、ただの風邪（かぜ）どころか、肺炎（はいえん）だった。\n译：因为咳嗽，我一直以为可能是感冒了。结果哪里是感冒啊，是肺炎。'
            },
            {
              w: '～ところだった',
              c: '差一点就…（实际并没有发生）\n例：誤解（ごかい）がもとで、危（あぶ）うく大切（たいせつ）な親友（しんゆう）を失（うしな）うところだった。\n译：差点因为误会而失去了重要的挚友。'
            },
            {
              w: '～どころではない',
              c: '不是…的时候（没有余力）\n例：A「林（はやし）さん、今度（こんど）の休（やす）みにいっしょに京都（きょうと）へ行（い）きませんか」\nB「ごめんなさいね。わたし、今（いま）忙（いそが）しくて、旅行（りょこう）どころじゃないんです」\n译：A：“林先生，这次休假一起去京都好吗？” B：“不好意思啊，我现在太忙了，根本没空去旅行。”'
            },
            {
              w: '～わけだ / ～というわけだ',
              c: '理所当然会…\n例：① 今日（きょう）から三連休（さんれんきゅう）、どこも人（ひと）が多（おお）いわけだ。\n② 運動（うんどう）によって免疫力（めんえきりょく）が高（たか）まり、病気（びょうき）にかかりにくくなるわけです。\n③ 産地（さんち）直送（ちょくそう）ですか。それで安（やす）いというわけだ。\n译：① 今天开始三连休，难怪哪里都人多。\n② 通过运动提高免疫力，从而不容易生病。\n③ 是产地直送啊，难怪这么便宜。'
            },
            {
              w: '～わけではない / ～というわけではない',
              c: '并非是…\n例：退院（たいいん）しても、病気（びょうき）が完全（かんぜん）に治（なお）ったわけではありませんから、無理（むり）をしないでください。\n译：即使出院了，也并不代表病就完全好了，所以不要勉强自己。'
            },
            {
              w: '～わけがない',
              c: '不可能…\n例：そんなに重（おも）いものを一人（ひとり）で運（はこ）べるわけがない。\n译：这么重的东西，一个人不可能搬得动。'
            },
            {
              w: '～わけにはいかない',
              c: '（因为某种原因）做不到…\n例：今日（きょう）は試験（しけん）の日（ひ）なので、休（やす）むわけにはいかない。\n译：因为今天要考试，所以不能请假。'
            },
            {
              w: '～ないわけにはいかない',
              c: '不可能不…、必须…\n例：弟（おとうと）の結婚式（けっこんしき）に出席（しゅっせき）しないわけにはいかない。\n译：弟弟的婚礼我不可能不出席。'
            },
            {
              w: '～限り①',
              c: '在…范围内全部做/持续某种状态（限界）\n例：何（なに）かわたくしがお手伝（てつだ）いできることがあったら言（い）ってください。できるかぎりのことはいたしますから。\n译：如果有什么我能帮得上的，请告诉我。我一定会尽力而为的。'
            },

              c: 'よっきゅう ⓪ 名 欲望，需求\n例：基本（きほん）的（てき）な欲求（よっきゅう）を満たす（みたす）。\n译：满足基本的需求。'
            },
            {
              w: '出荷',
              c: 'しゅっか ⓪ 名・动3 出货，装运\n例：新商品（しんしょうひん）を出荷（しゅっか）する。\n译：发出新商品。'
            },
            {
              w: '返却',
              c: 'へんきゃく ⓪ 名・动3 归还，退还\n例：借りた（かりた）本（ほん）を図書館（としょかん）に返却（へんきゃく）する。\n译：将借的书归还给图书馆。'
            },
            {
              w: '猛反対',
              c: 'もうはんたい ③ 名・动3 强烈反对\n例：猛反対（もうはんたい）を押し切っ（おしきっ）て実行（じっこう）する。\n译：顶着强烈反对强行实施。'
            },
            {
              w: '老婆心',
              c: 'ろうばしん ③ 名 过分操心，婆心\n例：老婆心（ろうばしん）ながら、一言（いちげん）忠告（ちゅうこく）しておく。\n译：或许是多管闲事，但我还是要忠告一句。'
            },
            {
              w: '意地悪',
              c: 'いじわる ③ 名・形 使坏，刁难\n例：彼（かれ）はいつも意地悪（いじわる）なことを言う（いう）。\n译：他总是说些刁难人的话。'
            },
            {
              w: '説得',
              c: 'せっとく ⓪ 名・动3 说服，劝导\n例：納得（なっとく）いくまで説得（せっとく）する。\n译：说服对方理解为止。'
            },
            {
              w: '合致',
              c: 'がっち ⓪ 名・动3 一致，符合\n例：結果（けっか）が予想（よそう）と合致（がっち）する。\n译：结果与预想一致。'
            },
            {
              w: '把握',
              c: 'はあく ③ 名・动3 紧握，掌握\n例：状況（じょうきょう）を正しく（ただしく）把握（はあく）して行動（こうどう）する必要（ひつよう）がある。\n译：必须准确掌握情况后再行动。'
            }
          ]
        }
      ]

      let words = []
      let currentIndex = 0
      let currentLibName = '' // 当前词库名称
      let savedLibraries = []

      // 进度记录管理
      function getProgress(libName) {
        return parseInt(localStorage.getItem(`progress_${libName}`) || '0')
      }

      function saveProgress(libName, index) {
        localStorage.setItem(`progress_${libName}`, index.toString())
      }

      function init() {
        renderLibraryList()
        // 默认加载第一个词库
        if (dataSource.length > 0) {
          loadDataFromLib(dataSource[0])
        }
      }

      // --- 数据加载 ---
      function loadDataFromLib(lib) {
        words = lib.words
        currentLibName = lib.name
        // 恢复上次的背诵进度，如果进度超出范围则重置为0
        const savedProgress = getProgress(currentLibName)
        currentIndex = savedProgress < words.length ? savedProgress : 0
        updateUI()
      }

      function updateUI() {
        renderWord()
        renderNotebooks()
        renderWordList(words, 'full-word-list')
      }

      function renderWord() {
        if (!words.length) return
        const word = words[currentIndex]
        document.getElementById('word-display').innerText = word.w

        // 为解释内容每行添加播放按钮
        const contentDisplay = document.getElementById('content-display')
        const lines = word.c.split('\n')
        contentDisplay.innerHTML = ''

        lines.forEach((line, index) => {
          const lineDiv = document.createElement('div')
          lineDiv.className = 'content-line'

          const textSpan = document.createElement('span')
          textSpan.innerHTML = line

          const speakButtons = document.createElement('div')
          speakButtons.className = 'speak-buttons'

          // 日语播放按钮
          const jpBtn = document.createElement('button')
          jpBtn.className = 'speak-btn-small'
          jpBtn.innerHTML = '日'
          jpBtn.title = '日语播放'
          jpBtn.onclick = () => speakLine(line, 'ja-JP')

          // 中文播放按钮
          const cnBtn = document.createElement('button')
          cnBtn.className = 'speak-btn-small'
          cnBtn.innerHTML = '中'
          cnBtn.title = '中文播放'
          cnBtn.onclick = () => speakLine(line, 'zh-CN')

          speakButtons.appendChild(jpBtn)
          speakButtons.appendChild(cnBtn)

          lineDiv.appendChild(textSpan)
          lineDiv.appendChild(speakButtons)
          contentDisplay.appendChild(lineDiv)
        })

        document.getElementById('content-display').style.display = 'none'
        document.getElementById('toggle-btn').style.visibility = 'visible'
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${words.length}`

        // 更新星星和纠错图标状态
        const favs = getRecords('fav')
        const errs = getRecords('err')
        document.getElementById('star-btn').className = favs.includes(word.w) ? 'active' : ''
        document.getElementById('err-btn').className = errs.includes(word.w) ? 'active' : ''
      }

      // --- 收藏与纠错核心逻辑 ---

      // 获取记录：key格式为 "fav_libname" 或 "err_libname"
      function getRecords(type) {
        if (!currentLibName) return []
        return JSON.parse(localStorage.getItem(`${type}_${currentLibName}`) || '[]')
      }

      function toggleRecord(type) {
        if (!words.length) return
        const wordW = words[currentIndex].w
        let records = getRecords(type)

        if (records.includes(wordW)) {
          records = records.filter((w) => w !== wordW)
        } else {
          records.push(wordW)
        }

        localStorage.setItem(`${type}_${currentLibName}`, JSON.stringify(records))
        renderWord() // 刷新图标
        renderNotebooks() // 刷新弹窗内的列表
      }

      function renderNotebooks() {
        renderSimpleList('fav')
        renderSimpleList('err')
      }

      function renderSimpleList(type) {
        const list = document.getElementById(`${type}-list`)
        const records = getRecords(type)
        list.innerHTML = records.length
          ? ''
          : '<li style="font-size:0.7rem; color:#ccc">暂无数据</li>'

        records.forEach((w) => {
          const li = document.createElement('li')
          li.innerText = w
          li.onclick = () => {
            const idx = words.findIndex((item) => item.w === w)
            if (idx !== -1) {
              currentIndex = idx
              saveProgress(currentLibName, currentIndex)
              renderWord()
              toggleModal(false)
            }
          }
          list.appendChild(li)
        })
      }

      // --- 库管理与通用 ---
      function renderLibraryList() {
        const container = document.getElementById('library-container')
        container.innerHTML = ''
        dataSource.forEach((lib) => {
          const div = document.createElement('div')
          div.className = 'lib-item'
          const progress = getProgress(lib.name)
          const total = lib.words.length
          const progressText = total > 0 ? ` (${progress + 1}/${total})` : ''
          div.innerHTML = `<span>${lib.name}${progressText}</span> <div><button onclick="loadDataFromLibByName('${lib.name}')">应用</button></div>`
          container.appendChild(div)
        })
      }

      function loadDataFromLibByName(libName) {
        const lib = dataSource.find((l) => l.name === libName)
        if (lib) {
          loadDataFromLib(lib)
        }
      }

      function showAnswer() {
        document.getElementById('content-display').style.display = 'block'
        document.getElementById('toggle-btn').style.visibility = 'hidden'
      }

      // 语音朗读功能 - 调用外部API
      async function speakWithAPI(textToSpeak, lang = 'ja-JP') {
        if (!textToSpeak.trim()) return

        // 根据语言选择语音模型
        const voice = lang === 'zh-CN' ? 'zh-CN-XiaozhenNeural' : 'ja-JP-MayuNeural'
        const speed = lang === 'zh-CN' ? 1 : 1

        try {
          const response = await fetch('https://tts.wangwangit.com/v1/audio/speech', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              input: textToSpeak,
              voice: voice,
              speed: speed,
              pitch: '0',
              style: 'affectionate'
            })
          })

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`)
          }

          const audioBlob = await response.blob()
          const audioUrl = URL.createObjectURL(audioBlob)

          // 创建音频元素并播放
          const audio = new Audio(audioUrl)
          audio.play()

          // 播放完成后清理URL
          audio.onended = () => {
            URL.revokeObjectURL(audioUrl)
          }
        } catch (error) {
          console.error('语音播放失败:', error)
          // 如果API调用失败，可以回退到浏览器API
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel()
            const utterance = new SpeechSynthesisUtterance(textToSpeak)
            utterance.lang = lang
            utterance.rate = speed
            window.speechSynthesis.speak(utterance)
          }
        }
      }

      function speakWord() {
        if (!words.length) return
        const word = words[currentIndex]
        let textToSpeak = word.w.trim()

        // 语音朗读时替换：N → めいし，V → どうし
        textToSpeak = textToSpeak.replace(/\bN(?!$)/g, 'めいし+').replace(/\bV(?!$)/g, 'どうし+')
        textToSpeak = textToSpeak.replace(/\bN$/g, 'めいし').replace(/\bV$/g, 'どうし')

        if (textToSpeak) {
          speakWithAPI(textToSpeak, 'ja-JP')
        }
      }

      function speakLine(line, lang = 'ja-JP') {
        if (!line.trim()) return

        let textToSpeak = line.trim()

        if (lang === 'zh-CN') {
          // 处理中文文本：去掉圆圈数字符号①-⑩
          textToSpeak = textToSpeak
            .replace(/^译[:：]?\s*/, '') // 去掉开头的"译："或"译"
            .replace(/[①-⑩]/g, '') // 去掉圆圈数字符号①-⑩
            .replace(/…/g, '什么') // 将…替换为什么
            .replace(/\s+/g, ' ') // 合并多个空格
            .trim()
        } else {
          // 处理日语文本：去掉开头的"例："或"例"，去掉所有括号内容
          textToSpeak = textToSpeak
            .replace(/^例[:：]?\s*/, '') // 去掉开头的"例："或"例"
            .replace(/（[^）]*）/g, '') // 去掉所有括号内的内容
            .replace(/\s+/g, ' ') // 合并多个空格
            .trim()
        }

        if (textToSpeak) {
          speakWithAPI(textToSpeak, lang)
        }
      }
      function prevWord() {
        if (currentIndex > 0) {
          currentIndex--
          saveProgress(currentLibName, currentIndex)
          renderWord()
        }
      }
      function nextWord() {
        if (currentIndex < words.length - 1) {
          currentIndex++
          saveProgress(currentLibName, currentIndex)
          renderWord()
        }
      }

      function handleSearch() {
        const q = document.getElementById('search-input').value.toLowerCase()
        const filtered = words.filter((i) => i.w.toLowerCase().includes(q))
        renderWordList(filtered, 'full-word-list')
      }

      function renderWordList(data, targetId) {
        const list = document.getElementById(targetId)
        list.innerHTML = ''
        data.forEach((item) => {
          const li = document.createElement('li')
          li.innerHTML = `<span>${item.w}</span><span style="opacity:0.3">#${words.indexOf(item) + 1}</span>`
          li.onclick = () => {
            currentIndex = words.indexOf(item)
            saveProgress(currentLibName, currentIndex)
            renderWord()
            toggleModal(false)
          }
          list.appendChild(li)
        })
      }

      function jumpToIndex() {
        const val = parseInt(document.getElementById('jump-input').value)
        if (val >= 1 && val <= words.length) {
          currentIndex = val - 1
          saveProgress(currentLibName, currentIndex)
          renderWord()
          toggleModal(false)
        }
      }

      function toggleModal(show) {
        document.getElementById('modal').style.display = show ? 'block' : 'none'
        if (show) updateUI()
      }

      document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return
        if (document.getElementById('modal').style.display === 'block') return
        if (e.code === 'Space') {
          showAnswer()
          e.preventDefault()
        }
        if (e.code === 'ArrowLeft') prevWord()
        if (e.code === 'ArrowRight') nextWord()
      })

      window.onload = init
    </script>
  </body>
</html>
