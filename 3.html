<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>言葉 - 极简背诵</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --accent-color: #f0f0f0;
        --border-color: #000000;
        --modal-bg: rgba(255, 255, 255, 0.98);
        --config-bg: #f9f9f9;
        --config-border: #eee;
        --option-bg: #fff;
        --option-hover-bg: #f9f9f9;
        --option-border: #ccc;
        --exam-card-bg: #fff;
        --feedback-bg: #f9f9f9;
      }
      body.dark {
        --bg-color: #000000;
        --text-color: #ffffff;
        --accent-color: #1a1a1a;
        --border-color: #444444;
        --modal-bg: rgba(0, 0, 0, 0.98);
        --config-bg: #111111;
        --config-border: #333333;
        --option-bg: #111111;
        --option-hover-bg: #222222;
        --option-border: #444444;
        --exam-card-bg: #111111;
        --feedback-bg: #111111;
      }
      /* 暗色模式下图标可见度提升 */
      body.dark .action-btns span {
        opacity: 0.5;
      }
      body.dark .action-btns span.active {
        opacity: 0.9;
      }
      body.dark .action-btns span:hover {
        opacity: 0.9;
      }
      body.dark .word-list li:hover {
        background: #fff;
        color: #000;
      }
      body.dark .exam-btn-primary {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      body.dark .exam-btn-primary:hover {
        background: #ccc;
        color: #000;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Hiragino Mincho ProN', 'MS Mincho', serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        line-height: 1.6;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body::-webkit-scrollbar {
        display: none;
      }

      /* 全局隐藏滚动条 */
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }

      /* 顶部导航 */
      header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-color);
        z-index: 10;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .theme-btn {
        cursor: pointer;
        font-size: 1.1rem;
        background: transparent;
        border: 1px solid var(--border-color);
        padding: 3px 8px;
        border-radius: 4px;
        line-height: 1;
      }
      .theme-btn:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }

      .logo {
        font-weight: bold;
        letter-spacing: 2px;
      }
      .settings-btn {
        cursor: pointer;
        text-decoration: underline;
        font-size: 0.9em;
      }

      /* 主体内容 */
      main {
        text-align: center;
        max-width: 600px;
        width: 90%;
        margin-top: 80px;
      }
      #word-display {
        font-size: 3rem;
        margin-bottom: 20px;
        font-weight: 500;
        min-height: 80px;
      }

      /* 收藏纠错动作按钮 */
      .action-btns {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .action-btns span {
        cursor: pointer;
        font-size: 1.5rem;
        white-space: nowrap;
        opacity: 0.3;
        transition: all 0.3s;
      }
      .action-btns span.active {
        opacity: 0.8;
      }

      /* 播放按钮 */
      .word-display-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .speak-btn-small {
        background: transparent;
        border: 1px solid var(--border-color);
        padding: 4px 8px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.8rem;
        border-radius: 3px;
      }
      .speak-btn-small:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }
      .content-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }
      .content-line:last-child {
        margin-bottom: 0;
      }
      .speak-buttons {
        display: flex;
        gap: 4px;
      }
      .action-btns span:hover {
        opacity: 0.8;
      }

      /* 模式切换按钮样式 */
      #mode-btn {
        background: var(--accent-color);
        border: 1px solid var(--border-color);
        padding: 5px 10px;
        border-radius: 3px;
        font-size: 0.9rem;
      }
      #mode-btn:hover {
        background: #000;
        color: #fff;
      }

      #content-display {
        font-size: 1.1rem;
        text-align: left;
        margin-bottom: 40px;
        padding: 20px;
        border-left: 2px solid var(--border-color);
        min-height: 100px;
        display: none;
      }

      button {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 10px 20px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        margin: 5px;
      }
      button:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }

      /* 导入导出按钮样式 */
      .import-export-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .import-export-buttons button {
        font-size: 0.8rem;
        padding: 8px 15px;
        background: var(--accent-color);
        border: 1px solid var(--border-color);
      }
      .import-export-buttons button:hover {
        background: #000;
        color: #fff;
      }
      .show-btn {
        font-size: 1.2rem;
        width: 200px;
        margin-bottom: 20px;
      }

      /* 弹窗样式 */
      #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--modal-bg);
        z-index: 100;
        overflow-y: auto;
      }
      .modal-content {
        max-width: 650px;
        margin: 50px auto;
        padding: 20px;
      }
      .modal-header {
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
      }

      .config-section {
        background: var(--config-bg);
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid var(--config-border);
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        margin-bottom: 10px;
        box-sizing: border-box;
        font-family: inherit;
      }

      .lib-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--config-border);
        margin-bottom: 5px;
        font-size: 0.8rem;
      }

      .word-list {
        list-style: none;
        padding: 0;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid var(--border-color);
        margin-top: 10px;
      }
      .word-list li {
        padding: 8px;
        cursor: pointer;
        border-bottom: 1px solid var(--config-border);
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
      }
      .word-list li:hover {
        background: #000;
        color: #fff;
      }

      .close-modal {
        cursor: pointer;
        font-weight: bold;
      }
      .progress {
        font-size: 0.8rem;
        margin-top: 10px;
        opacity: 0.6;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border-color);
        margin: 25px 0;
      }
      h4 {
        margin: 15px 0 5px 0;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* 考试模式样式 */
      #exam-setup-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--modal-bg);
        z-index: 200;
        display: none;
        justify-content: center;
        align-items: center;
      }
      #exam-setup-modal.show {
        display: flex;
      }
      .exam-setup-content {
        background: var(--exam-card-bg);
        border: 2px solid var(--border-color);
        padding: 30px 40px;
        max-width: 450px;
        width: 90%;
        text-align: center;
      }
      .exam-setup-content h3 {
        margin-top: 0;
        font-size: 1.3rem;
        letter-spacing: 2px;
      }
      .exam-option-group {
        margin: 20px 0;
        text-align: left;
      }
      .exam-option-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .exam-option-group select,
      .exam-option-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        font-family: inherit;
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      .exam-setup-btns {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 25px;
      }
      .exam-setup-btns button {
        padding: 10px 25px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .exam-btn-primary {
        background: var(--text-color);
        color: var(--bg-color);
        border: 1px solid var(--text-color);
      }
      .exam-btn-primary:hover {
        opacity: 0.8;
      }

      /* 考试界面 */
      #exam-panel {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-color);
        z-index: 150;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
      }
      #exam-panel.show {
        display: flex;
      }
      .exam-header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-color);
        box-sizing: border-box;
        z-index: 5;
      }
      .exam-progress {
        font-size: 0.85rem;
        opacity: 0.7;
      }
      .exam-quit-btn {
        cursor: pointer;
        text-decoration: underline;
        font-size: 0.9rem;
      }
      .exam-body {
        margin-top: 60px;
        max-width: 600px;
        width: 90%;
        text-align: center;
        padding: 20px;
      }
      .exam-question-label {
        font-size: 0.85rem;
        opacity: 0.5;
        margin-bottom: 15px;
        letter-spacing: 2px;
      }
      .exam-question-word {
        font-size: 2.5rem;
        font-weight: 500;
        margin-bottom: 35px;
        min-height: 60px;
        line-height: 1.3;
      }
      .exam-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .exam-option {
        padding: 15px 20px;
        border: 1px solid var(--option-border);
        cursor: pointer;
        background: var(--option-bg);
        color: var(--text-color);
        text-align: left;
        font-size: 1rem;
        transition: all 0.2s;
        border-radius: 4px;
      }
      .exam-option:hover {
        border-color: var(--text-color);
        background: var(--option-hover-bg);
        transform: scale(1.06);
        font-size: 1.1rem;
      }
      .exam-option.correct {
        border-color: #4caf50;
        background: #e8f5e9;
        color: #2e7d32;
      }
      .exam-option.wrong {
        border-color: #f44336;
        background: #ffebee;
        color: #c62828;
      }
      .exam-option.disabled {
        opacity: 0.7;
        opacity: 0.7;
      }
      .exam-feedback {
        margin-top: 20px;
        font-size: 0.9rem;
        min-height: 24px;
      }
      .exam-nav-btns {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 25px;
      }
      .exam-nav-btns button {
        padding: 10px 30px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .exam-next-btn {
        display: none;
      }
      .exam-next-btn.show {
        display: inline-block;
      }

      /* 选项详情弹窗 */
      #option-detail-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 300;
        justify-content: center;
        align-items: center;
      }
      #option-detail-overlay.show {
        display: flex;
      }
      .option-detail-card {
        background: var(--exam-card-bg);
        border: 2px solid var(--border-color);
        padding: 25px 30px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        line-height: 1.8;
      }
      .option-detail-card h4 {
        margin: 0 0 15px 0;
        font-size: 1.4rem;
      }
      .option-detail-card .kana-line {
        font-size: 1rem;
        opacity: 0.5;
        margin-bottom: 15px;
      }
      .option-detail-card .meaning-line {
        font-size: 0.95rem;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--config-border);
      }
      .option-detail-card .example-line {
        font-size: 0.85rem;
        color: var(--text-color);
        opacity: 0.7;
        white-space: pre-line;
      }
      .option-detail-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
      }
      .option-detail-actions button {
        padding: 8px 18px;
        cursor: pointer;
        font-size: 0.85rem;
        border: 1px solid var(--border-color);
        background: transparent;
        color: var(--text-color);
        font-family: inherit;
        transition: all 0.2s;
      }
      .option-detail-actions button:hover {
        background: var(--text-color);
        color: var(--bg-color);
      }
      .option-detail-actions button.fav-active {
        background: #ffd700;
        border-color: #ffd700;
      }

      /* 考试结果 */
      #exam-result {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--modal-bg);
        z-index: 250;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #exam-result.show {
        display: flex;
      }
      .exam-result-content {
        text-align: center;
        max-width: 500px;
        width: 90%;
      }
      .exam-result-content h2 {
        font-size: 1.8rem;
        letter-spacing: 3px;
        margin-bottom: 15px;
      }
      .exam-score {
        font-size: 4rem;
        font-weight: bold;
        margin: 20px 0;
      }
      .exam-score-detail {
        font-size: 0.95rem;
        opacity: 0.7;
        margin-bottom: 25px;
      }
      .exam-wrong-list {
        text-align: left;
        margin: 20px 0;
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid var(--config-border);
        padding: 15px;
      }
      .exam-wrong-list h4 {
        margin-top: 0;
        text-align: center;
      }
      .exam-wrong-item {
        padding: 8px 0;
        border-bottom: 1px solid var(--config-border);
        font-size: 0.9rem;
      }
      .exam-wrong-item:last-child {
        border-bottom: none;
      }
      .exam-wrong-item .wrong-q {
        font-weight: bold;
      }
      .exam-wrong-item .wrong-a {
        color: #c62828;
        font-size: 0.85rem;
      }
      .exam-result-btns {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 20px;
      }
      .exam-result-btns button {
        padding: 10px 25px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">KOTOBA.</div>
      <div class="header-right">
        <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="切换主题">🌙</button>
        <div class="settings-btn" onclick="toggleModal(true)">SETTINGS & NOTEBOOK</div>
      </div>
    </header>

    <main>
      <div class="word-display-container">
        <div id="word-display">未加载数据</div>
        <button class="speak-btn-small" onclick="speakWord()" title="播放单词">🔊</button>
      </div>

      <div class="action-btns" id="current-actions">
        <span id="star-btn" onclick="toggleRecord('fav')">⭐ 收藏</span>
        <span id="err-btn" onclick="toggleRecord('err')">❌ 纠错</span>
        <span id="mode-btn" onclick="toggleStudyMode()" title="切换背诵模式">📚 普通模式</span>
        <span id="exam-btn" onclick="openExamSetup()" title="开始考试" style="font-size:1.5rem;cursor:pointer;opacity:0.5;transition:all 0.3s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">📝 考试</span>
      </div>

      <div id="content-display"></div>
      <button class="show-btn" id="toggle-btn" onclick="showAnswer()">显示答案</button>
      <div class="btn-group">
        <button onclick="prevWord()">← PREV</button>
        <button onclick="nextWord()">NEXT →</button>
      </div>
      <div class="progress" id="progress-text">0 / 0</div>
    </main>

    <!-- 考试设置弹窗 -->
    <div id="exam-setup-modal">
      <div class="exam-setup-content">
        <h3>📝 考试设置</h3>
        <div class="exam-option-group">
          <label>选择词库</label>
          <select id="exam-lib-select"></select>
        </div>
        <div class="exam-option-group">
          <label>考试方向</label>
          <select id="exam-direction">
            <option value="jp2cn">日选中 (看日语选中文)</option>
            <option value="cn2jp">中选日 (看中文选日语)</option>
          </select>
        </div>
        <div class="exam-option-group">
          <label>出题范围</label>
          <select id="exam-scope">
            <option value="all">全部单词</option>
            <option value="favorites">仅收藏</option>
          </select>
        </div>
        <div class="exam-option-group" style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" id="exam-include-learned" style="width:auto;margin:0" />
          <label for="exam-include-learned" style="margin:0;font-weight:normal">包含已考过的单词</label>
        </div>
        <div class="exam-option-group" id="exam-count-group">
          <label>题目数量</label>
          <input type="number" id="exam-count" value="10" min="2" max="100" />
        </div>
        <div class="exam-setup-btns">
          <button onclick="closeExamSetup()">取消</button>
          <button class="exam-btn-primary" onclick="startExam()">开始考试</button>
        </div>
      </div>
    </div>

    <!-- 考试界面 -->
    <div id="exam-panel">
      <div class="exam-header">
        <span class="exam-progress" id="exam-progress-text">1 / 10</span>
        <span class="exam-quit-btn" onclick="quitExam()">退出考试</span>
      </div>
      <div class="exam-body">
        <div class="exam-question-label" id="exam-direction-label">日选中</div>
        <div class="exam-question-word" id="exam-question"></div>
        <div class="exam-options" id="exam-options"></div>
        <div class="exam-feedback" id="exam-feedback"></div>
        <div class="exam-nav-btns">
          <button id="exam-prev-btn" onclick="prevExamQuestion()" style="display:none">← 上一题</button>
          <button class="exam-next-btn" id="exam-next-btn" onclick="nextExamQuestion()">下一题 →</button>
        </div>
      </div>
    </div>

    <!-- 选项详情弹窗 -->
    <div id="option-detail-overlay" onclick="closeOptionDetail(event)">
      <div class="option-detail-card" onclick="event.stopPropagation()">
        <h4 id="detail-word"></h4>
        <div class="kana-line" id="detail-kana"></div>
        <div class="meaning-line" id="detail-meaning"></div>
        <div class="example-line" id="detail-example"></div>
        <div class="option-detail-actions">
          <button id="detail-fav-btn" onclick="toggleDetailFav()">⭐ 收藏</button>
          <button id="detail-speak-btn" onclick="speakDetailWord()">🔊 朗读</button>
          <button onclick="document.getElementById('option-detail-overlay').classList.remove('show')">关闭</button>
        </div>
      </div>
    </div>

    <!-- 考试结果 -->
    <div id="exam-result">
      <div class="exam-result-content">
        <h2>考试结果</h2>
        <div class="exam-score" id="exam-score">0%</div>
        <div class="exam-score-detail" id="exam-score-detail"></div>
        <div class="exam-wrong-list" id="exam-wrong-list"></div>
        <div class="exam-result-btns">
          <button onclick="retryExam()">重新考试</button>
          <button class="exam-btn-primary" onclick="closeExamResult()">返回背诵</button>
        </div>
      </div>
    </div>

    <div id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>DASHBOARD</span>

      // --- 收藏与纠错核心逻辑 ---

      function toggleRecord(type) {

        const word = words[currentIndex]
        const wordW = word.w

        let libName = currentLibName
        if (studyMode === 'favorites' && word.sourceLib) {
          libName = word.sourceLib
        }

        let records = JSON.parse(localStorage.getItem(`${type}_${libName}`) || '[]')

        if (records.includes(wordW)) {
          records = records.filter((w) => w !== wordW)
        } else {
          records.push(wordW)
        }

        localStorage.setItem(`${type}_${libName}`, JSON.stringify(records))
        renderWord() // 刷新图标
        renderNotebooks() // 刷新弹窗内的列表

        // 在收藏模式下，取消收藏后需要重新加载收藏列表

      // 语音朗读功能 - 调用外部API
      async function speakWithAPI(textToSpeak, lang = 'ja-JP') {
        if (!textToSpeak.trim()) return

        // 根据语言选择语音模型
        const voice = lang === 'zh-CN' ? 'zh-CN-XiaozhenNeural' : 'ja-JP-MayuNeural'
        const speed = 1.3

        try {
          const response = await fetch('https://tts.wangwangit.com/v1/audio/speech', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              input: textToSpeak,
              voice: voice,
              speed: speed,
              pitch: '0',
              style: 'affectionate'
            })
          })

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`)
          }

          const audioBlob = await response.blob()
          const audioUrl = URL.createObjectURL(audioBlob)

          // 创建音频元素并播放
          const audio = new Audio(audioUrl)
          audio.play()

          // 播放完成后清理URL
          audio.onended = () => {
            URL.revokeObjectURL(audioUrl)
          }
        } catch (error) {
          console.error('语音播放失败:', error)
          // 如果API调用失败，可以回退到浏览器API
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel()
            const utterance = new SpeechSynthesisUtterance(textToSpeak)
            utterance.lang = lang
            utterance.rate = speed
            window.speechSynthesis.speak(utterance)
          }
        }
      }

      function speakWord() {
        if (!words.length) return
        const word = words[currentIndex]
        let textToSpeak = getSpeakJPText(word, currentLibName)

        // 语音朗读时替换：N → めいし，V → どうし（如果N或V在末尾，不加"+"），/符号添加停顿
        textToSpeak = textToSpeak
          .replace(/\bN(\d+)\s*\//g, 'めいし$1/')
          .replace(/\bV(\d+)\s*\//g, 'どうし$1/')
        textToSpeak = textToSpeak.replace(/\bN$/g, 'めいし').replace(/\bV$/g, 'どうし')
        textToSpeak = textToSpeak
          .replace(/\bN(\d+)/g, 'めいし$1+')
          .replace(/\bV(\d+)/g, 'どうし$1+')
        textToSpeak = textToSpeak.replace(/\bN(?!$)/g, 'めいし+').replace(/\bV(?!$)/g, 'どうし+')
        textToSpeak = textToSpeak.replace(/\//g, '。/。')

        if (textToSpeak) {
          speakWithAPI(textToSpeak, 'ja-JP')
        }
      }

      function speakLine(line, lang = 'ja-JP') {
        if (!line.trim()) return

        let textToSpeak = line.trim()

        if (lang === 'zh-CN') {
          // 处理中文文本：去掉圆圈数字符号⓪-⑩
          textToSpeak = textToSpeak
            .replace(/^译[:：]?\s*/, '') // 去掉开头的"译："或"译"
            .replace(/[⓪①-⑩]/g, '') // 去掉圆圈数字符号⓪①-⑩
            .replace(/…/g, '什么') // 将…替换为什么
            .replace(/\s+/g, ' ') // 合并多个空格
            .replace(/\//g, '。/。') // 在/符号前后添加空格产生停顿效果
            .trim()
        } else {
          // 处理日语文本：去掉开头的"例："或"例"，去掉所有括号内容
          textToSpeak = textToSpeak
            .replace(/^例[:：]?\s*/, '') // 去掉开头的"例："或"例"
            .replace(/（[^）]*）/g, '') // 去掉所有括号内的内容
            .replace(/\s+/g, ' ') // 合并多个空格
            .replace(/\//g, '。/。') // 在/符号前后添加空格产生停顿效果
            .trim()
        }

        if (textToSpeak) {
          speakWithAPI(textToSpeak, lang)
        }
      }

      // --- 背诵模式切换功能 ---
      function toggleStudyMode() {
        if (studyMode === 'normal') {
          // 切换到收藏模式前保存当前词库信息
          previousLibName = currentLibName

          // 切换到收藏模式
          studyMode = 'favorites'
          loadFavoritesMode()
          document.getElementById('mode-btn').innerHTML = '❤️ 收藏模式'
          document.getElementById('mode-btn').title = '切换到普通模式'
        } else {
          // 切换回普通模式
          studyMode = 'normal'

          // 重新加载之前保存的词库
          let targetLibName = previousLibName

          // 如果之前没有保存的词库信息，使用默认的第一个词库
          if (!targetLibName || targetLibName === '收藏单词') {
            targetLibName = dataSource.length > 0 ? dataSource[0].name : ''
          }

          const targetLib = dataSource.find((lib) => lib.name === targetLibName)
          if (targetLib) {
            loadDataFromLib(targetLib)
          } else if (dataSource.length > 0) {
            // 如果找不到目标词库，加载第一个词库
            loadDataFromLib(dataSource[0])
          }

          document.getElementById('mode-btn').innerHTML = '📚 普通模式'
          document.getElementById('mode-btn').title = '切换到收藏模式'
        }
      }

      function loadFavoritesMode() {
        // 获取当前词库的收藏单词
        const favKey = `fav_${currentLibName}`
        const favWords = JSON.parse(localStorage.getItem(favKey) || '[]')

        const currentLib = dataSource.find((l) => l.name === currentLibName)
        const favorites = []
        if (currentLib) {
          favWords.forEach((wordW) => {
            const wordObj = currentLib.words.find((w) => w.w === wordW)
            if (wordObj) {
              favorites.push({ ...wordObj, sourceLib: currentLibName })
            }
          })
        }

        if (favorites.length === 0) {
          alert('当前词库暂无收藏单词，请先收藏一些单词再切换到收藏模式')
          studyMode = 'normal'
          document.getElementById('mode-btn').innerHTML = '📚 普通模式'
          return
        }

        // 设置收藏模式的单词列表
        const currentWord = words.length > 0 ? words[currentIndex] : null
        words = favorites

        // 保持当前索引位置，如果当前单词还在新列表中，保持原位置；否则调整到index+1
        if (currentWord && words.length > 0) {
          const newIndex = words.findIndex(w => w.w === currentWord.w)
          if (newIndex !== -1) {
            currentIndex = newIndex
          } else {
            // 当前单词被移除了，调整到index+1位置，但不超过列表长度
            currentIndex = Math.min(currentIndex + 1, words.length - 1)
          }
        } else {
          currentIndex = 0
        }

        currentLibName = '收藏单词'

        // 保存进度并渲染单词
        saveProgress(currentLibName, currentIndex)
        renderWord()
      }

      function openExamSetup() {

          }
          document.getElementById('exam-direction').value = saved.direction || 'jp2cn'
          document.getElementById('exam-scope').value = saved.scope || 'all'
          document.getElementById('exam-include-learned').checked = saved.includeLearned || false
          document.getElementById('exam-count').value = saved.count || 10
        } else {
          document.getElementById('exam-lib-select').value = currentLibName || dataSource[0]?.name || ''
          document.getElementById('exam-direction').value = 'jp2cn'
          document.getElementById('exam-scope').value = 'all'
          document.getElementById('exam-include-learned').checked = false
          document.getElementById('exam-count').value = 10
        }
      }

      // 关闭考试设置面板
      function closeExamSetup() {
        document.getElementById('exam-setup-modal').classList.remove('show')
      }

      // 当前弹窗显示的单词对象
      let detailCurrentWord = null

      // 显示选项详情弹窗
      function showOptionDetail(opt) {

          const meaning = lines.length >= 2 ? lines[1].trim() : ''

          document.getElementById('detail-kana').style.display = 'block'
          document.getElementById('detail-meaning').textContent = meaning
          document.getElementById('detail-meaning').style.display = 'block'

          document.getElementById('detail-example').style.display = 'none'
        } else {

          document.getElementById('detail-kana').style.display = 'none'

      // 更新弹窗收藏按钮状态
      function updateDetailFavBtn() {
        if (!detailCurrentWord) return
        const libName = examState.libName
        const favKey = `fav_${libName}`
        const favs = JSON.parse(localStorage.getItem(favKey) || '[]')
        const btn = document.getElementById('detail-fav-btn')
        if (favs.includes(detailCurrentWord.w)) {
          btn.textContent = '⭐ 已收藏'
          btn.classList.add('fav-active')
        } else {
          btn.textContent = '⭐ 收藏'
          btn.classList.remove('fav-active')
        }
      }

      // 弹窗中切换收藏
      function toggleDetailFav() {
        if (!detailCurrentWord) return
        const libName = examState.libName
        const favKey = `fav_${libName}`
        let favs = JSON.parse(localStorage.getItem(favKey) || '[]')

        if (favs.includes(detailCurrentWord.w)) {
          favs = favs.filter((w) => w !== detailCurrentWord.w)

        }

      // 弹窗中朗读单词
      function speakDetailWord() {
        if (!detailCurrentWord) return
        const word = detailCurrentWord
        const meaningText = getChineseTranslation(word.c, examState.libName)
        speakWordAndMeaning(word, meaningText, examState.libName)
      }

      // 关闭选项详情弹窗（点击遮罩关闭）
      function closeOptionDetail(event) {
        if (event.target === document.getElementById('option-detail-overlay')) {
          document.getElementById('option-detail-overlay').classList.remove('show')
        }
      }

      // 判断是否为单词类词库（N1单词/N2单词），格式为"读音 \n 词性 中文释义"
      function isWordLib(libName) {
        return libName === 'N1单词' || libName === 'N2单词'
      }

      // 获取朗读用的日语文本：单词类词库用假名，语法类用原词
      function getSpeakJPText(word, libName) {
        if (isWordLib(libName)) {
          const lines = word.c.split('\n')
          const kana = lines.length >= 1 ? lines[0].trim() : ''
          // 如果假名是英文/片假名词源（如almond, engineer等），则读原词
          if (kana && !/^[a-zA-Z]/.test(kana)) return kana
        }
        return word.w.trim()
      }

      // 提取语法词库的例句（取"例："和"译："行，去掉标签）
      function getExampleText(text) {
        const lines = text.split('\n')
        const example = []
        for (const line of lines) {
          const trimmed = line.trim()
          if (!trimmed) continue
          if (trimmed.startsWith('例') || trimmed.startsWith('译')) {
            example.push(trimmed.replace(/^(例|译)[：:]\s*/, ''))
          }
        }
        return example.length > 0 ? example.join('\n') : null
      }

      // 获取单词的纯含义（用于日选中选项显示、中选日题目显示）
      // 单词格式: "读音 \n 词性 中文释义" → 取下标1
      // 语法格式: "各种…之后...\n例：...\n译：..." → 取第一行
      function getPureMeaning(text, libName) {
        if (isWordLib(libName)) {
          // 单词格式：取 \n 分隔后的第二行
          const lines = text.split('\n')
          if (lines.length >= 2) {
            const secondLine = lines[1].trim()
            if (secondLine) return secondLine
          }
          return text.substring(0, 40)
        }
        // 语法格式：取第一行含义（跳过"例"和"译"行）
        const lines = text.split('\n')
        for (const line of lines) {
          const trimmed = line.trim()
          if (!trimmed) continue
          if (trimmed.startsWith('译') || trimmed.startsWith('例')) continue
          return trimmed
        }
        return text.substring(0, 40)
      }

      // 获取单词的中文翻译（用于错题回顾显示）
      // 单词格式: "读音 \n 词性 中文释义" → 取下标1
      // 语法格式: "...\n例：...\n译：中文翻译" → 取"译："后面的内容
      // 获取单词的中文含义（用于朗读中文解释）
      // 单词格式: "读音 \n 词性 中文释义" → 取下标1
      // 语法格式: "语法含义\n例：...\n译：..." → 取第一行（语法点含义）
      function getChineseTranslation(text, libName) {
        if (isWordLib(libName)) {
          const lines = text.split('\n')
          if (lines.length >= 2) {
            const secondLine = lines[1].trim()
            if (secondLine) return secondLine
          }
          return text.substring(0, 40)
        }
        // 语法格式：取第一行语法点含义
        const lines = text.split('\n')
        for (const line of lines) {
          const trimmed = line.trim()
          if (!trimmed) continue
          if (trimmed.startsWith('译') || trimmed.startsWith('例')) continue
          return trimmed
        }
        return text.substring(0, 40)
      }

      // 开始考试
      // 考试缓存：记录已考过的下标，key格式 exam_history_词库名
      function getExamHistory(libName) {
        return JSON.parse(localStorage.getItem(`exam_history_${libName}`) || '[]')
      }
      function setExamHistory(libName, indices) {
        localStorage.setItem(`exam_history_${libName}`, JSON.stringify(indices))
      }
      function clearExamHistory(libName) {
        localStorage.removeItem(`exam_history_${libName}`)
      }
      // 考试缓存：记录收藏模式已考过的下标，key格式 exam_history_fav_词库名
      function getExamFavHistory(libName) {
        return JSON.parse(localStorage.getItem(`exam_history_fav_${libName}`) || '[]')
      }
      function setExamFavHistory(libName, indices) {
        localStorage.setItem(`exam_history_fav_${libName}`, JSON.stringify(indices))
      }
      function clearExamFavHistory(libName) {
        localStorage.removeItem(`exam_history_fav_${libName}`)
      }

      function startExam() {
        const libName = document.getElementById('exam-lib-select').value
        const direction = document.getElementById('exam-direction').value
        const scope = document.getElementById('exam-scope').value
        const includeLearned = document.getElementById('exam-include-learned').checked
        const count = parseInt(document.getElementById('exam-count').value) || 10

        // 保存当前设置
        saveExamSettings({ libName, direction, scope, includeLearned, count })

        const lib = dataSource.find((l) => l.name === libName)
        if (!lib || lib.words.length === 0) {
          alert('所选词库没有单词')
          return
        }

        let pool = [...lib.words] // 候选池

        if (scope === 'favorites') {
          // 仅收藏模式：从该词库的收藏中选题
          const favKey = `fav_${libName}`
          const favWords = JSON.parse(localStorage.getItem(favKey) || '[]')
          pool = lib.words.filter((w) => favWords.includes(w.w))
          if (pool.length === 0) {
            alert('该词库暂无收藏单词，请先收藏一些')
            return
          }
        }

        // 默认跳过已考过的（除非勾选了"包含已考过"）
        if (!includeLearned) {
          const historyKey = scope === 'favorites' ? `exam_history_fav_${libName}` : `exam_history_${libName}`
          const history = JSON.parse(localStorage.getItem(historyKey) || '[]')

          // 如果候选池中的单词已经全部考过，清空记录，直接使用全部pool（不过滤）
          const allLearned = pool.every((w) => {
            const gIdx = lib.words.findIndex((lw) => lw.w === w.w)
            return history.includes(gIdx)
          })

          if (!allLearned) {
            // 还有没考过的，正常过滤
            const learnedSet = new Set(history)
            pool = pool.filter((w) => {
              const gIdx = lib.words.findIndex((lw) => lw.w === w.w)
              return !learnedSet.has(gIdx)
            })
          } else {
            // 全部考过了，清空记录从头开始
            localStorage.removeItem(historyKey)
          }
        }

        const actualCount = Math.min(count, pool.length)

        // 随机选题
        const shuffled = [...pool].sort(() => Math.random() - 0.5)
        const selected = shuffled.slice(0, actualCount)

        // 初始化考试状态
        examState = {
          libName: libName,
          lib: lib,
          direction: direction,
          scope: scope,
          includeLearned: includeLearned,
          questions: selected,
          currentQ: 0,
          total: actualCount,
          correct: 0,
          wrong: 0,
          wrongList: [],
          answered: false,
          _answers: {}, // 记录每道题的选择结果，用于回显
          _maxReached: 0 // 记录用户到达过的最大题号
        }

        closeExamSetup()

        // 显示考试界面
        document.getElementById('exam-panel').classList.add('show')
        document.getElementById('exam-direction-label').textContent =
          direction === 'jp2cn' ? '看日语 → 选中文解释' : '看中文 → 选日语单词'
        document.getElementById('exam-result').classList.remove('show')

        renderExamQuestion()
      }

      // 渲染考试题目
      function renderExamQuestion() {
        if (!examState) return

        const q = examState.questions[examState.currentQ]
        const direction = examState.direction

        // 更新进度
        document.getElementById('exam-progress-text').textContent =
          `${examState.currentQ + 1} / ${examState.total}`

        // 显示题目
        const questionEl = document.getElementById('exam-question')
        if (direction === 'jp2cn') {
          // 日选中：显示日语单词，单词类词库带上假名
          if (isWordLib(examState.libName)) {
            const lines = q.c.split('\n')
            const kana = lines.length >= 1 ? lines[0].trim() : ''
            questionEl.innerHTML = `${q.w}<div style="font-size:1.2rem;opacity:0.5;margin-top:8px">${kana}</div>`
          } else {
            questionEl.innerHTML = q.w
          }
        } else {
          // 中选日：显示中文解释
          const meaning = getPureMeaning(q.c, examState.libName)
          questionEl.innerHTML = meaning
        }

        // 生成4个选项（已答过的题使用保存的选项顺序）
        const savedAnswer = examState._answers ? examState._answers[examState.currentQ] : null
        const options = savedAnswer ? savedAnswer.allOptions : generateOptions(q, direction, examState.lib)
        const optionsEl = document.getElementById('exam-options')
        optionsEl.innerHTML = ''

        options.forEach((opt, idx) => {
          const div = document.createElement('div')
          div.className = 'exam-option'
          let label = `<strong>${String.fromCharCode(65 + idx)}.</strong> ${opt.text}`
          // 中选日模式下，单词类词库在右侧显示假名
          if (direction === 'cn2jp' && opt.kana) {
            label += ` <span style="font-size:0.85rem;opacity:0.5">${opt.kana}</span>`
          }
          div.innerHTML = label
          div.style.cursor = 'pointer'
          // 统一用同一个点击处理函数
          div._optIdx = idx
          div._opt = opt
          div._options = options
          div.onclick = function() {
            handleOptionClick(this)
          }
          optionsEl.appendChild(div)
        })

        // 恢复或重置状态
        if (savedAnswer) {
          // 回看已答过的题，恢复选择结果
          examState.answered = true
          document.getElementById('exam-feedback').innerHTML = savedAnswer.feedbackHTML
          document.getElementById('exam-next-btn').classList.add('show')

          // 恢复选项高亮和翻译
          const optionEls = document.querySelectorAll('#exam-options .exam-option')
          optionEls.forEach((el, i) => {
            el.classList.add('disabled')
            if (savedAnswer.allOptions[i].isCorrect) {
              el.classList.add('correct')
            }
            // 恢复翻译显示
            if (isWordLib(examState.libName)) {
              const opt = savedAnswer.allOptions[i]
              const lines = opt.word.c.split('\n')
              const meaning = lines.length >= 2 ? lines[1].trim() : ''
              if (meaning) {
                const transSpan = document.createElement('span')
                transSpan.className = 'exam-option-trans'
                transSpan.textContent = ` — ${meaning}`
                transSpan.style.cssText = 'opacity:0.7;font-size:0.85rem;word-break:break-all'
                el.appendChild(transSpan)
              }
            }
          })
          if (!savedAnswer.isCorrect && optionEls[savedAnswer.optIdx]) {
            optionEls[savedAnswer.optIdx].classList.add('wrong')
          }
        } else {
          // 新题，重置
          examState.answered = false
          document.getElementById('exam-feedback').innerHTML = ''
          document.getElementById('exam-next-btn').classList.remove('show')
        }

        // 上一题按钮：第一题隐藏，否则显示
        const prevBtn = document.getElementById('exam-prev-btn')
        prevBtn.style.display = examState.currentQ > 0 ? 'inline-block' : 'none'

        // 下一题按钮：已答过的题显示，未答过且已是最后一题隐藏
        const nextBtn = document.getElementById('exam-next-btn')
        if (examState.currentQ < examState._maxReached) {
          nextBtn.classList.add('show')
        }

        // 预加载音频缓存：首次加载当前题+后5题，之后每次切换补充新的
        prefetchAudioBatch()
      }

      // 预加载音频缓存（当前题+往后5题）
      function prefetchAudioBatch() {
        if (!examState) return
        if (!examState._audioCache) {
          examState._audioCache = {}
        }
        const cache = examState._audioCache
        const total = examState.total
        const cur = examState.currentQ

        // 预加载范围：当前题到 cur+5，不超过总数
        const end = Math.min(cur + 5, total - 1)
        for (let i = cur; i <= end; i++) {
          if (cache[i]) continue // 已缓存则跳过
          // 占位，防止重复请求
          cache[i] = 'loading'
          const q = examState.questions[i]
          const meaningText = getChineseTranslation(q.c, examState.libName)

          let jpText = getSpeakJPText(q, examState.libName)
          jpText = jpText
            .replace(/\bN(\d+)\s*\//g, 'めいし$1/')
            .replace(/\bV(\d+)\s*\//g, 'どうし$1/')
          jpText = jpText.replace(/\bN$/g, 'めいし').replace(/\bV$/g, 'どうし')
          jpText = jpText
            .replace(/\bN(\d+)/g, 'めいし$1+')
            .replace(/\bV(\d+)/g, 'どうし$1+')
          jpText = jpText.replace(/\bN(?!$)/g, 'めいし+').replace(/\bV(?!$)/g, 'どうし+')
          jpText = jpText.replace(/\//g, '。/。')

          let cnText = meaningText
          cnText = cnText.replace(/[⓪①-⑩]/g, '')
          cnText = cnText.replace(/[①-⑨]/g, '')
          cnText = cnText.replace(/…/g, '什么')
          cnText = cnText.replace(/\//g, '。/。')
          cnText = cnText.trim()

          Promise.all([
            fetchTTSBlob(jpText, 'ja-JP'),
            fetchTTSBlob(cnText, 'zh-CN')
          ]).then(([jpBlob, cnBlob]) => {
            cache[i] = { jpBlob, cnBlob }
          })
        }
      }

      // 生成4个选项（1个正确 + 3个干扰项），优先选择相似的
      function generateOptions(correctWord, direction, lib) {
        const allWords = lib.words
        const correctIdx = allWords.findIndex((w) => w.w === correctWord.w)
        const maxOptions = Math.min(4, allWords.length)

        // 对每个候选干扰项计算相似度分数
        const candidates = []
        const correctOptionText = direction === 'jp2cn'
          ? getPureMeaning(correctWord.c, examState.libName)
          : correctWord.w

        allWords.forEach((word, idx) => {
          if (idx === correctIdx) return
          const optionText = direction === 'jp2cn'
            ? getPureMeaning(word.c, examState.libName)
            : word.w
          const score = calcSimilarity(correctOptionText, optionText, direction)
          candidates.push({ idx, word, optionText, score })
        })

        // 按相似度降序排列，取前 (maxOptions-1) 个，不够则随机补
        candidates.sort((a, b) => b.score - a.score)
        const needCount = maxOptions - 1
        const topSimilar = candidates.slice(0, needCount)

        const distractors = new Set()
        distractors.add(correctIdx)
        topSimilar.forEach((c) => distractors.add(c.idx))

        // 如果相似的不够，随机补充
        const remaining = [...candidates.slice(needCount)].sort(() => Math.random() - 0.5)
        for (const c of remaining) {
          if (distractors.size >= maxOptions) break
          distractors.add(c.idx)
        }

        // 构建选项
        const options = []
        distractors.forEach((idx) => {
          const word = allWords[idx]
          let text = ''
          let kana = ''
          if (direction === 'jp2cn') {
            text = getPureMeaning(word.c, examState.libName)
          } else {
            text = word.w
            if (isWordLib(examState.libName)) {
              const lines = word.c.split('\n')
              kana = lines.length >= 1 ? lines[0].trim() : ''
            }
          }
          options.push({
            index: idx,
            text: text,
            kana: kana,
            word: word,
            isCorrect: idx === correctIdx
          })
        })

        return options.sort(() => Math.random() - 0.5)
      }

      // 计算两个选项文本的相似度（分数越高越相似）
      function calcSimilarity(correctText, candidateText, direction) {
        let score = 0

        if (direction === 'cn2jp') {
          // 中选日：比较日语单词相似度
          // 长度相近加分
          const lenDiff = Math.abs(correctText.length - candidateText.length)
          score += Math.max(0, 10 - lenDiff * 2)

          // 共同字符数加分
          const correctChars = new Set(correctText)
          const candidateChars = new Set(candidateText)
          let common = 0
          correctChars.forEach((ch) => { if (candidateChars.has(ch)) common++ })
          score += common * 3

          // 假名/汉字组成相似加分（检查是否同为纯假名、混合等）
          const isCorrectKana = /^[\u3040-\u309f\u30a0-\u30ff]+$/.test(correctText)
          const isCandidateKana = /^[\u3040-\u309f\u30a0-\u30ff]+$/.test(candidateText)
          if (isCorrectKana === isCandidateKana) score += 5

          // 相同前缀加分（前2个字符）
          if (correctText.length >= 2 && candidateText.length >= 2) {
            const prefix1 = correctText.substring(0, 2)
            const prefix2 = candidateText.substring(0, 2)
            if (prefix1 === prefix2) score += 10
            else if (prefix1[0] === prefix2[0]) score += 5
          }

          // 相同后缀加分
          if (correctText.length >= 1 && candidateText.length >= 1) {
            if (correctText.slice(-1) === candidateText.slice(-1)) score += 5
          }
        } else {
          // 日选中：比较中文释义相似度
          // 共同汉字加分
          const hanzi = /[\u4e00-\u9fff]/g
          const correctHanzi = (correctText.match(hanzi) || []).join('')
          const candidateHanzi = (candidateText.match(hanzi) || []).join('')
          const correctHSet = new Set(correctHanzi)
          const candidateHSet = new Set(candidateHanzi)
          let commonH = 0
          correctHSet.forEach((ch) => { if (candidateHSet.has(ch)) commonH++ })
          score += commonH * 3

          // 长度相近
          const lenDiff = Math.abs(correctText.length - candidateText.length)
          score += Math.max(0, 8 - lenDiff)

          // 共同词/字组加分（2-gram）
          const bigrams = (s) => {
            const set = new Set()
            for (let i = 0; i < s.length - 1; i++) set.add(s.substring(i, i + 2))
            return set
          }
          const correctBigrams = bigrams(correctText)
          const candidateBigrams = bigrams(candidateText)
          let commonBigram = 0
          correctBigrams.forEach((b) => { if (candidateBigrams.has(b)) commonBigram++ })
          score += commonBigram * 2
        }

        return score
      }

      // 处理选项点击（统一入口）
      function handleOptionClick(div) {
        if (!examState) return
        if (!examState.answered) {
          // 未作答：选择选项
          selectExamOption(div._optIdx, div._opt, div._options)
        } else {
          // 已作答：弹窗显示该单词详情
          showOptionDetail(div._opt)
        }
      }

      // 选择选项
      function selectExamOption(optIdx, option, allOptions) {
        if (!examState || examState.answered) return

        examState.answered = true

        const correctOption = allOptions.find((o) => o.isCorrect)
        const q = examState.questions[examState.currentQ]
        const direction = examState.direction

        // 高亮正确选项
        const optionEls = document.querySelectorAll('#exam-options .exam-option')
        optionEls.forEach((el, i) => {
          el.classList.add('disabled')
          if (allOptions[i].isCorrect) {
            el.classList.add('correct')
          }
        })

        // 判断正误
        let feedbackHTML = ''
        if (option.isCorrect) {
          examState.correct++
          feedbackHTML = '<span style="color:#4caf50">✅ 正确！</span>'
          // 收藏模式下答对自动取消收藏，并从已考记录中移除
          if (examState.scope === 'favorites') {
            const removed = removeFromFavorites(q)
            if (removed) {
              feedbackHTML += ' <span style="font-size:0.85rem;opacity:0.7">(已移出收藏)</span>'
              // 从已考记录中移除该单词
              removeFromExamHistory(q)
            }
          }
        } else {
          examState.wrong++
          // 高亮用户选择的错误选项
          if (optionEls[optIdx]) {
            optionEls[optIdx].classList.add('wrong')
          }

          // 显示正确答案
          const correctText = correctOption.text
          feedbackHTML = `<span style="color:#c62828">❌ 错误！正确答案是：<strong>${correctText}</strong></span>`

          // 自动加入收藏
          autoAddToFavorites(q)

          // 记录错题
          examState.wrongList.push({
            word: q,
            direction: direction
          })
        }

        // 对单词类词库，在每个选项右侧显示翻译
        if (isWordLib(examState.libName)) {
          optionEls.forEach((el, i) => {
            const opt = allOptions[i]
            const lines = opt.word.c.split('\n')
            const meaning = lines.length >= 2 ? lines[1].trim() : ''
            if (meaning) {
              const transSpan = document.createElement('span')
              transSpan.className = 'exam-option-trans'
              transSpan.textContent = ` — ${meaning}`
              transSpan.style.cssText = 'opacity:0.7;font-size:0.85rem;word-break:break-all'
              el.appendChild(transSpan)
            }
          })
        }

        // 对语法类词库，显示例句
        if (!isWordLib(examState.libName)) {
          const exampleText = getExampleText(q.c)
          if (exampleText) {
            feedbackHTML += `<div style="margin-top:12px;padding:10px;background:var(--feedback-bg);border-left:2px solid var(--border-color);font-size:0.85rem;text-align:left;line-height:1.6;white-space:pre-line">${exampleText}</div>`
          }
        }

        document.getElementById('exam-feedback').innerHTML = feedbackHTML

        // 保存选择结果，用于回显
        if (!examState._answers) examState._answers = {}
        examState._answers[examState.currentQ] = {
          optIdx: optIdx,
          option: option,
          allOptions: allOptions,
          feedbackHTML: feedbackHTML,
          isCorrect: option.isCorrect
        }

        // 朗读单词和解释：播放预请求的音频
        playPrefetchedAudio()

        // 显示下一题按钮
        document.getElementById('exam-next-btn').classList.add('show')
      }

      // 播放预请求的音频blob（无缝衔接播放）
      async function playPrefetchedAudio() {
        const cache = examState._audioCache
        const blobs = cache ? cache[examState.currentQ] : null
        if (!blobs || blobs === 'loading') {
          const q = examState.questions[examState.currentQ]
          const meaningText = getChineseTranslation(q.c, examState.libName)
          speakWordAndMeaning(q, meaningText, examState.libName)
          return
        }
        await playAudioSequence(blobs.jpBlob, blobs.cnBlob)
      }

      // 依次朗读日语单词和中文解释（两个音频请求并行发出）
      async function speakWordAndMeaning(wordObj, meaning, libName) {
        let jpText = getSpeakJPText(wordObj, libName || examState?.libName || '')
        jpText = jpText
          .replace(/\bN(\d+)\s*\//g, 'めいし$1/')
          .replace(/\bV(\d+)\s*\//g, 'どうし$1/')
        jpText = jpText.replace(/\bN$/g, 'めいし').replace(/\bV$/g, 'どうし')
        jpText = jpText
          .replace(/\bN(\d+)/g, 'めいし$1+')
          .replace(/\bV(\d+)/g, 'どうし$1+')
        jpText = jpText.replace(/\bN(?!$)/g, 'めいし+').replace(/\bV(?!$)/g, 'どうし+')
        jpText = jpText.replace(/\//g, '。/。')

        let cnText = meaning
        cnText = cnText.replace(/[⓪①-⑩]/g, '')
        cnText = cnText.replace(/[①-⑨]/g, '')
        cnText = cnText.replace(/…/g, '什么')
        cnText = cnText.replace(/\//g, '。/。')
        cnText = cnText.trim()

        const [jpBlob, cnBlob] = await Promise.all([
          fetchTTSBlob(jpText, 'ja-JP'),
          fetchTTSBlob(cnText, 'zh-CN')
        ])

        await playAudioSequence(jpBlob, cnBlob)
      }

      // 无缝播放两个音频blob（用AudioContext精确时序）
      async function playAudioSequence(blob1, blob2) {
        if (!blob1 && !blob2) return
        if (!blob1) { await playAudioBlob(blob2); return }
        if (!blob2) { await playAudioBlob(blob1); return }

        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)()

          // 并行解码两个音频
          const [buf1, buf2] = await Promise.all([
            decodeAudio(ctx, blob1),
            decodeAudio(ctx, blob2)
          ])

          if (!buf1 && !buf2) { ctx.close(); return }
          if (!buf1) { playBuffer(ctx, buf2); return }
          if (!buf2) { playBuffer(ctx, buf1); return }

          // 精确时序：buf1播完立即播buf2
          const source1 = ctx.createBufferSource()
          source1.buffer = buf1
          source1.connect(ctx.destination)

          const source2 = ctx.createBufferSource()
          source2.buffer = buf2
          source2.connect(ctx.destination)

          // 用精确时间调度：start(when, offset, duration)
          const now = ctx.currentTime
          source1.start(now)
          source2.start(now + buf1.duration) // buf1结束时立即开始buf2

          return new Promise((resolve) => {
            source2.onended = () => { ctx.close(); resolve() }
          })
        } catch (e) {
          // 回退到Audio元素方式
          const url1 = URL.createObjectURL(blob1)
          const url2 = URL.createObjectURL(blob2)
          const a1 = new Audio(url1)
          const a2 = new Audio(url2)
          let done = false
          const cleanup = () => {
            if (done) return
            done = true
            URL.revokeObjectURL(url1)
            URL.revokeObjectURL(url2)
          }
          a1.onended = () => { a2.play() }
          a2.onended = cleanup
          a2.onerror = cleanup
          a1.onerror = () => { a2.play() }
          a1.play()
          await new Promise((r) => { a2.onended = () => { cleanup(); r() }; a2.onerror = () => { cleanup(); r() } })
        }
      }

      // 解码音频blob为AudioBuffer
      function decodeAudio(ctx, blob) {
        return new Promise((resolve) => {
          const reader = new FileReader()
          reader.onload = () => {
            ctx.decodeAudioData(reader.result, resolve, () => resolve(null))
          }
          reader.onerror = () => resolve(null)
          reader.readAsArrayBuffer(blob)
        })
      }

      // 播放单个AudioBuffer
      function playBuffer(ctx, buffer) {
        const source = ctx.createBufferSource()
        source.buffer = buffer
        source.connect(ctx.destination)
        source.start()
        return new Promise((resolve) => {
          source.onended = () => { ctx.close(); resolve() }
        })
      }

      // 获取TTS音频blob（不播放）
      function fetchTTSBlob(textToSpeak, lang) {
        return new Promise((resolve) => {
          if (!textToSpeak.trim()) {
            resolve(null)
            return
          }

          const voice = lang === 'zh-CN' ? 'zh-CN-XiaozhenNeural' : 'ja-JP-MayuNeural'
          const speed = 1.3

          fetch('https://tts.wangwangit.com/v1/audio/speech', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              input: textToSpeak,
              voice: voice,
              speed: speed,
              pitch: '0',
              style: 'affectionate'
            })
          })
            .then((response) => {
              if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`)
              return response.blob()
            })
            .then((audioBlob) => resolve(audioBlob))
            .catch(() => resolve(null))
        })
      }

      // 播放音频blob
      function playAudioBlob(blob) {
        return new Promise((resolve) => {
          const audioUrl = URL.createObjectURL(blob)
          const audio = new Audio(audioUrl)
          audio.onended = () => {
            URL.revokeObjectURL(audioUrl)
            resolve()
          }
          audio.onerror = () => {
            URL.revokeObjectURL(audioUrl)
            resolve()
          }
          audio.play()
        })
      }

      // 返回Promise的语音播放（用于async/await顺序播放）
      function speakWithAPIAsync(textToSpeak, lang) {
        return new Promise((resolve) => {
          if (!textToSpeak.trim()) {
            resolve()
            return
          }

          const voice = lang === 'zh-CN' ? 'zh-CN-XiaozhenNeural' : 'ja-JP-MayuNeural'
          const speed = 1.3

          fetch('https://tts.wangwangit.com/v1/audio/speech', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              input: textToSpeak,
              voice: voice,
              speed: speed,
              pitch: '0',
              style: 'affectionate'
            })
          })
            .then((response) => {
              if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`)
              return response.blob()
            })
            .then((audioBlob) => {
              const audioUrl = URL.createObjectURL(audioBlob)
              const audio = new Audio(audioUrl)
              audio.onended = () => {
                URL.revokeObjectURL(audioUrl)
                resolve()
              }
              audio.onerror = () => {
                URL.revokeObjectURL(audioUrl)
                resolve()
              }
              audio.play()
            })
            .catch(() => {
              // API失败时回退到浏览器内置TTS
              if (window.speechSynthesis) {
                window.speechSynthesis.cancel()
                const utterance = new SpeechSynthesisUtterance(textToSpeak)
                utterance.lang = lang
                utterance.rate = speed
                utterance.onend = () => resolve()
                utterance.onerror = () => resolve()
                window.speechSynthesis.speak(utterance)
              } else {
                resolve()
              }
            })
        })
      }

      // 辅助延迟函数
      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms))
      }

      // 答错自动加入收藏
      function autoAddToFavorites(word) {
        const libName = examState.libName
        const favKey = `fav_${libName}`
        let favs = JSON.parse(localStorage.getItem(favKey) || '[]')

        if (!favs.includes(word.w)) {
          favs.push(word.w)
          localStorage.setItem(favKey, JSON.stringify(favs))
        }
      }

      // 从收藏中移除，返回是否成功
      function removeFromFavorites(word) {
        const libName = examState.libName
        const favKey = `fav_${libName}`
        let favs = JSON.parse(localStorage.getItem(favKey) || '[]')
        const idx = favs.indexOf(word.w)
        if (idx !== -1) {
          favs.splice(idx, 1)
          localStorage.setItem(favKey, JSON.stringify(favs))
          return true
        }
        return false
      }

      // 从已考记录中移除该单词
      function removeFromExamHistory(word) {
        const libName = examState.libName
        const gIdx = examState.lib.words.findIndex((w) => w.w === word.w)
        if (gIdx === -1) return

        // 从普通考试记录和收藏考试记录中同时移除
        const keys = [`exam_history_${libName}`, `exam_history_fav_${libName}`]
        keys.forEach((key) => {
          const history = JSON.parse(localStorage.getItem(key) || '[]')
          const idx = history.indexOf(gIdx)
          if (idx !== -1) {
            history.splice(idx, 1)
            localStorage.setItem(key, JSON.stringify(history))
          }
        })
      }

      // 上一题
      function prevExamQuestion() {
        if (!examState) return
        if (examState.currentQ <= 0) return

        examState.currentQ--
        renderExamQuestion()
      }

      // 下一题
      function nextExamQuestion() {
        if (!examState) return

        // 只能前进到已回答过的题+1
        const maxReached = examState._maxReached || 0
        if (examState.currentQ < maxReached + 1 && examState.currentQ < examState.total - 1) {
          examState.currentQ++
          if (examState.currentQ > maxReached) {
            examState._maxReached = examState.currentQ
          }
          renderExamQuestion()
        } else if (examState.answered && examState.currentQ >= examState.total - 1) {
          // 最后一题已回答，结束考试
          showExamResult()
        }
      }

      // 显示考试结果
      function showExamResult() {
        if (!examState) return
        document.getElementById('exam-panel').classList.remove('show')

        const resultPanel = document.getElementById('exam-result')
        resultPanel.classList.add('show')

        const total = examState.total
        const correct = examState.correct
        const wrong = examState.wrong
        const score = Math.round((correct / total) * 100)

        document.getElementById('exam-score').textContent = `${score}%`
        document.getElementById('exam-score-detail').innerHTML =
          `共 ${total} 题，答对 ${correct} 题，答错 ${wrong} 题`

        // 记录已考过的下标到缓存（勾选"包含已考过"时不记录，因为是复习模式）
        const libName = examState.libName
        if (!examState.includeLearned) {
          const historyKey = examState.scope === 'favorites' ? `exam_history_fav_${libName}` : `exam_history_${libName}`
          // 一次性读取，内存中修改，最后一次性写回
          const history = JSON.parse(localStorage.getItem(historyKey) || '[]')
          let changed = false
          examState.questions.forEach((q) => {
            const gIdx = examState.lib.words.findIndex((w) => w.w === q.w)
            if (gIdx !== -1 && !history.includes(gIdx)) {
              history.push(gIdx)
              changed = true
            }
          })
          if (changed) {
            localStorage.setItem(historyKey, JSON.stringify(history))
          }
        }

        // 检查是否全部考完（普通模式），全部考完则自动清空
        if (examState.scope !== 'favorites') {
          const history = getExamHistory(libName)
          if (history.length >= examState.lib.words.length) {
            clearExamHistory(libName)
          }
        }

        // 错题列表
        const wrongListEl = document.getElementById('exam-wrong-list')
        if (examState.wrongList.length > 0) {
          let html = '<h4>❌ 错题回顾（已自动加入收藏）</h4>'
          examState.wrongList.forEach((item, idx) => {
            const qWord = item.word.w
            const meaning = getPureMeaning(item.word.c, examState.libName)
            const translation = getChineseTranslation(item.word.c, examState.libName)
            html += `<div class="exam-wrong-item" style="cursor:pointer" data-wrong-idx="${idx}">
              <div class="wrong-q">${idx + 1}. ${item.direction === 'jp2cn' ? qWord : meaning}</div>
              <div class="wrong-a">→ ${item.direction === 'jp2cn' ? meaning : qWord}（${translation}）</div>
            </div>`
          })
          wrongListEl.innerHTML = html
          wrongListEl.style.display = 'block'

          // 绑定点击事件
          wrongListEl.querySelectorAll('.exam-wrong-item').forEach((el) => {
            el.onclick = () => {
              const idx = parseInt(el.dataset.wrongIdx)
              const word = examState.wrongList[idx].word
              showOptionDetail({ word })
            }
          })
        } else {
          wrongListEl.innerHTML = ''
          wrongListEl.style.display = 'none'
        }

        // 保留设置供retry使用
        examState._libName = examState.libName
        examState._direction = examState.direction
        examState._scope = examState.scope
        examState._includeLearned = examState.includeLearned
        examState._count = examState.total
      }

      // 重新考试（使用相同设置）
      function retryExam() {
        if (!examState) return
        document.getElementById('exam-result').classList.remove('show')
        // 使用上次考试的设置
        const libName = examState._libName || examState.libName
        const direction = examState._direction || examState.direction
        const scope = examState._scope || 'all'
        const includeLearned = examState._includeLearned || false
        const count = examState._count || examState.total

        document.getElementById('exam-lib-select').value = libName
        document.getElementById('exam-direction').value = direction
        document.getElementById('exam-scope').value = scope
        document.getElementById('exam-include-learned').checked = includeLearned
        document.getElementById('exam-count').value = count

        startExam()
      }

      // 关闭考试结果
      function closeExamResult() {
        document.getElementById('exam-result').classList.remove('show')
        // 更新UI以反映新增的收藏
        updateUI()
      }

      // 清除所有考试记录
      function clearAllExamHistory() {
        if (!confirm('确定要清除所有词库的考试记录吗？')) return
        dataSource.forEach((lib) => {
          clearExamHistory(lib.name)
          clearExamFavHistory(lib.name)
        })
        alert('考试记录已清除')
        updateUI()
      }

      // 导出所有localStorage数据
      function exportAllData() {
        const data = {}
        const keys = [
          'theme',
          'exam_settings',
          'favorites_export',
          'word_progress'
        ]
        // 导出所有词库的收藏、考试记录
        dataSource.forEach((lib) => {
          const favKey = `fav_${lib.name}`
          const historyKey = `exam_history_${lib.name}`
          const favHistoryKey = `exam_history_fav_${lib.name}`
          ;[favKey, historyKey, favHistoryKey].forEach((k) => {
            const val = localStorage.getItem(k)
            if (val !== null) data[k] = val
          })
        })
        // 导出通用keys
        keys.forEach((k) => {
          const val = localStorage.getItem(k)
          if (val !== null) data[k] = val
        })
        // 导出当前进度
        dataSource.forEach((lib) => {
          const progressKey = `progress_${lib.name}`
          const val = localStorage.getItem(progressKey)
          if (val !== null) data[progressKey] = val
        })

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = `kotoba-backup-${new Date().toISOString().slice(0, 10)}.json`
        a.click()
        URL.revokeObjectURL(url)
      }

      // 触发导入文件选择
      function importAllData() {
        document.getElementById('import-file-input').click()
      }

      // 处理导入文件
      function handleImportFile(event) {
        const file = event.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result)
            if (typeof data !== 'object' || data === null) {
              alert('文件格式错误')
              return
            }
            if (!confirm('导入数据将覆盖当前所有设置、收藏和考试记录，确定继续？')) return
            Object.entries(data).forEach(([key, value]) => {
              localStorage.setItem(key, value)
            })
            alert('导入成功！页面将刷新以应用新数据。')
            location.reload()
          } catch (err) {
            alert('文件解析失败：' + err.message)
          }
        }
        reader.readAsText(file)
        event.target.value = ''
      }

      // 退出考试
      function quitExam() {
        if (examState && examState.currentQ >= 0) {
          if (!confirm('确定要退出考试吗？当前进度将不会保存。')) return
        }
        document.getElementById('exam-panel').classList.remove('show')
        examState = null
        updateUI()
      }

      // 键盘快捷键（考试模式下）
      document.addEventListener('keydown', (e) => {
        // 考试模式下的键盘操作
        if (document.getElementById('exam-panel').classList.contains('show')) {
          if (e.key >= '1' && e.key <= '4') {
            const options = document.querySelectorAll('#exam-options .exam-option')
            const idx = parseInt(e.key) - 1
            if (options[idx]) {
              options[idx].click()
            }
          }
          if (e.key === 'Enter' || e.key === ' ') {
            const nextBtn = document.getElementById('exam-next-btn')
            if (nextBtn.classList.contains('show')) {
              e.preventDefault()
              nextExamQuestion()
            }
          }
          // 左右箭头切换题目
          if (e.key === 'ArrowLeft') {
            e.preventDefault()
            prevExamQuestion()
          }
          if (e.key === 'ArrowRight') {
            e.preventDefault()
            nextExamQuestion()
          }
          return
        }

        // 普通模式快捷键（原有逻辑）
        if (document.activeElement.tagName === 'INPUT') return
        if (document.getElementById('modal').style.display === 'block') return
        if (document.getElementById('exam-setup-modal').classList.contains('show')) return
        if (document.getElementById('exam-result').classList.contains('show')) return
        if (e.code === 'Space') {
          showAnswer()
          e.preventDefault()
        }
        if (e.code === 'ArrowLeft') prevWord()
        if (e.code === 'ArrowRight') nextWord()
      })

      window.onload = init
    </script>
  </body>
</html>
